services:
  - type: web
    name: nysc-youth-transition-survey
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_VERSION
        value: 22
